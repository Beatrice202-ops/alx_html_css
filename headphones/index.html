<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Section</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container nav-container">
        <div class="logo">
          <img src="images/logo.png" alt="Logo" />
        </div>
        <nav class="nav-links">
          <a href="#">Home</a>
          <a href="#">About</a>
          <a href="#">Services</a>
          <a href="#">Contact</a>
        </nav>
        <button class="cta-btn">Get Started</button>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <div class="container hero-container">
        <div class="hero-text">
          <h1>Building the Future of Web Experiences</h1>
          <p>
            Learn, build, and grow with hands-on experience creating modern web
            pages that adapt seamlessly to all screen sizes.
          </p>
          <button class="hero-btn">Start Now</button>
        </div>
        <div class="hero-image">
          <img src="images/hero-image.png" alt="Hero Illustration" />
        </div>
      </div>
    </section>
  </body>
</html>
